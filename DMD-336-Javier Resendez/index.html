<!-- Doctype shows "WHat version of html are you using?"-->
<!DOCTYPE html>

<!-- Everything in inside the HTML Element -->
<!-- Lang attribute indicates which language -->
<html lang="en">
    <!-- head = info about the page-->
    <head>
        <!-- meta = information about the page-->
         <!-- utf-8 character encoding-->
        <meta charset = "UTF-8">
        <!-- title is required; used for tab/bookmark-->
        <title> My first Website </title>

        <!-- sets viewport size (responsive design)-->

        <meta name = "viewport" content = "with=device-width">
        
    </head>
    <!-- body = content of the page -->
    <body>
        <!-- h1 = top level heading -->
        <h1> My first Website</h1>
        <!-- ( This is how to make a comment in HTML) P = paragraph -->
        
        <p> Hello, World!</p>
        <p>HyperText Markup Language (HTML)</p>
    </body>
    
</html>
